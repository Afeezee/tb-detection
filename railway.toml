# Root Railway config — used by the BACKEND service.
#
# Monorepo layout:
#   backend service  → root directory = "/" (this file, this Dockerfile).
#   frontend service → root directory = "frontend/" (uses frontend/railway.toml).
#
# The Dockerfile is at backend/Dockerfile but the build context is the repo
# root so it can COPY src/, config.py, and models/ alongside the backend code.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "src/**", "config.py", "models/**", "railway.toml"]

[deploy]
startCommand = "uvicorn main:app --app-dir /app/backend --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
