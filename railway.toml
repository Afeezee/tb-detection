# Single-service monorepo — one Dockerfile at the repo root builds the
# Next.js static export in a Node stage and copies it into a Python
# runtime that serves both the /api/* endpoints and the static frontend
# on the same port.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
