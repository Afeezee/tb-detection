[build]
builder = "DOCKERFILE"
# Dockerfile lives inside backend/ but its context is the repo root so it can
# COPY config.py, src/, and models/.
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn main:app --app-dir /app/backend --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
