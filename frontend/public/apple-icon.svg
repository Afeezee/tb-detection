    <path d="M13.5 11 L18.5 11" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M15 11 C 15 11, 8 11, 7 18 C 6.2 23, 8.4 24.5, 11 24.5 C 13.6 24.5, 15 23, 15 20 Z" fill="#ffffff"/>
    <path d="M17 11 C 17 11, 24 11, 25 18 C 25.8 23, 23.6 24.5, 21 24.5 C 18.4 24.5, 17 23, 17 20 Z" fill="#ffffff"/>
    <circle cx="10.5" cy="18" r="1.7" fill="#c1121f"/>
    <circle cx="10.5" cy="18" r="3.2" fill="none" stroke="#c1121f" stroke-width="0.7" stroke-opacity="0.6"/>
  </g>
</svg>
